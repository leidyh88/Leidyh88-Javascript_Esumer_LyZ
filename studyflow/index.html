<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>studyflow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <!-- formulario -->

        <section class="form-section">

            <span class="eyebrow">
                STUDYFLOW
            </span>

            <h1>
                Organiza tus tareas
            </h1>

            <p class="description">
                Agrega tus actividades de estudio,
                completa tus pendientes y mantén
                organizado tu trabajo.
            </p>

            <form id="task-form">

                <label for="task">
                    Nueva tarea
                </label>

                <input
                    type="text"
                    id="task"
                    placeholder="Ej. Practicar JavaScript"
                >

                <label for="priority">
                    Prioridad
                </label>

                <select id="priority">

                    <option value="alta">
                        Alta
                    </option>

                    <option
                        value="media"
                        selected
                    >
                        Media
                    </option>

                    <option value="alta">
                        Baja
                    </option>

                </select>

                <button type="submit">
                    + Agregar tarea
                </button>

                <p
                    class="message"
                    id="message"
                ></p>

            </form>




        </section>

    </main>
    <script src="js/script.js"></script>
</main>
</html>
